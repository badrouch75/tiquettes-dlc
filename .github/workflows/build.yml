name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilation
        env:
          # Cle de signature fixe, versionnee dans le depot : les mises a jour
          # s'installent par-dessus l'ancienne version sans perdre les reglages.
          KEYSTORE_PASSWORD: jyraQldjg2TyjbhtdK9sMTn_
        run: gradle --no-daemon assembleRelease

      - name: Preparer le fichier
        run: cp app/build/outputs/apk/release/app-release.apk etiquettes-dlc.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Étiquettes DLC 1.0.${{ github.run_number }}
          body: Ouvrir ce lien dans Chrome sur la Sunmi, télécharger etiquettes-dlc.apk puis l'installer.
          files: etiquettes-dlc.apk
